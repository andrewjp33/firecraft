<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FireCraft</title>
  <link data-trunk rel="rust" data-bin="firecraft-web" data-cargo-profile="wasm-release" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #808080; }
    #firecraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #firecraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #eee; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="firecraft_canvas"></canvas>
  <div id="firecraft_loading">Loading FireCraft&hellip;</div>
</body>
</html>
