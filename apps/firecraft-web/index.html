<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FireCraft</title>
  <!-- Picks the WebAssembly build; stand-ins for newer browser features; and the message when
       FireCraft can't start. -->
  <script data-trunk src="support.js"></script>
  <!-- The modern build. legacy.html is the one for older browsers; post_build.py puts it in
       legacy/ and makes the page load whichever this browser can run. -->
  <link data-trunk rel="rust" data-bin="firecraft-web" data-cargo-profile-release="wasm-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" data-keep-debug />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #808080; }
    /* top/right/bottom/left rather than inset, which Safari only has from 14.1. */
    #firecraft_canvas { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }
    #firecraft_loading { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
      color: #eee; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="firecraft_canvas"></canvas>
  <div id="firecraft_loading">Loading FireCraft&hellip;</div>
</body>
</html>
