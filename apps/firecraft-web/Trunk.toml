# Build with `make web` (or `make web-debug`); serve locally with `make web-serve`. They make
# two builds, modern and one for older browsers (legacy.html), with different flags (see the
# Makefile and post_build.py); plain `trunk build` without the legacy build fails in post_build.py.
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

# Checks both builds, and puts the legacy one beside the modern one (see post_build.py).
[[hooks]]
stage = "post_build"
command = "python3"
command_arguments = ["post_build.py"]

[serve]
addresses = ["127.0.0.1"]
port = 8766
