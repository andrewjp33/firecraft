[package]
name = "firecraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FireCraft in the browser (WebAssembly)"
publish = false

[lints]
workspace = true

[dependencies]
firecraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["glow", "default_fonts", "persistence"] }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Element", "console"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
