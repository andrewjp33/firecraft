[package]
name = "firecraft-sysclip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FireCraft's system clipboard for Fireworks-compatible object data (the 'PNG' format)"

[lints]
workspace = true

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString", "NSURL"] }
