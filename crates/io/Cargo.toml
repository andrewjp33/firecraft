[package]
name = "firecraft-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FireCraft document I/O: Fireworks PNG (editable) and flat images"

[lints]
workspace = true

[dependencies]
firecraft-fwpng = { workspace = true }
# Flat images opened as documents (and pattern/texture files).
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp", "tiff", "tga", "webp", "png"] }
# GIF frames as stored (offsets, disposal), which Fireworks keeps when it opens an animated GIF.
gif = "0.14"
# Resolution tags, which `image` doesn't report.
tiff = "0.11"
# Export: JPEG (progressive, quality, density) and JPEG XL (pure Rust, BSD-3/Apache-2.0).
jpeg-encoder = "0.7"
jixel = { version = "0.5", default-features = false, features = ["avx", "neon", "sse", "wasm", "splines"] }
firecraft-raster = { workspace = true }
firecraft-doc = { workspace = true }
png = { workspace = true }
weezl = { workspace = true }
thiserror = { workspace = true }

# JPEG XL, colour-managed to sRGB (moxcms is pure Rust). Multi-threaded on the desktop; the browser build decodes on one thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jxl-oxide = { version = "0.12", features = ["moxcms"] }
# WebP export: libwebp (BSD), compiled from C, so not in the browser build.
webp = "0.3"
# Lossless PNG optimization on export (OptiPNG-style levels; links libdeflate, C).
oxipng = { version = "10.2", default-features = false, features = ["zopfli", "parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jxl-oxide = { version = "0.12", default-features = false, features = ["moxcms"] }
