[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/firecraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/firecraft"

[workspace.dependencies]
# internal (layers: L0 fwpng raster, L1 doc, L2 io, L3 engine, L4 ui-egui; see docs/architecture.md)
firecraft-fwpng = { path = "crates/fwpng" }
firecraft-raster = { path = "crates/raster" }
firecraft-doc = { path = "crates/doc" }
firecraft-io = { path = "crates/io" }
firecraft-engine = { path = "crates/engine" }
firecraft-ui-egui = { path = "crates/ui-egui" }
firecraft-sysclip = { path = "crates/sysclip" }
firecraft-stroke = { path = "crates/stroke" }
firecraft-text = { path = "crates/text" }

# Craft suite shared libraries, pinned to the same revision PhotoCraft uses.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }

# external
thiserror = "2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
png = "0.18"
weezl = "0.1"
log = "0.4"
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", default-features = false }
rfd = "0.17"
instant = { version = "0.1", features = ["wasm-bindgen"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
#opt-level = 1
#debug = "line-tables-only"
opt-level = 0
debug = true

# The pixel work (rendering, effects, compositing) is optimised fully even in debug builds,
# so the debug app stays responsive.
[profile.dev.package.firecraft-raster]
opt-level = 3

[profile.dev.package.firecraft-doc]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Browser build (apps/firecraft-web).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"

# The Craft suite's egui/winit fork (same pins as PhotoCraft), so craft-ui and FireCraft agree.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
